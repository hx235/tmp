[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traininsight"
version = "0.1.0"
description = "Open-source skeleton to instrument neural network training and correlate metrics with capability growth - generalized FullNoiseScale paper-exact H=∇²L and G=∇L over full input set N, renamed to TrainInsight"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TrainInsight Contributors" }]
keywords = ["machine-learning", "deep-learning", "training", "instrumentation", "metrics", "capability"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
